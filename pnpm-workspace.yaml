  sharp@>=0.34 <0.35.5: 0.35.5
  tar@<7.5.21: 7.5.21

packageExtensions:
  '@luminescent/ui@*':
    peerDependencies:
      tailwindcss: '*'

patchedDependencies:
  '@builder.io/qwik-city@1.20.3': patches/@builder.io__qwik-city@1.20.3.patch
